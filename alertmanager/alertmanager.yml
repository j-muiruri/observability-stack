global:
  resolve_timeout: 5m
  # Global SMTP Configuration for Email
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "alerts@example.com"
  smtp_auth_username: "alerts@example.com"
  smtp_auth_password: "your-app-password"
  smtp_require_tls: true

route:
  receiver: "email-only"
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Route 1: Critical Alerts -> Discord + SMS
    - matchers:
        - severity="critical"
      receiver: "critical-sms-discord"
      repeat_interval: 1h

    # Route 2: Warning Alerts -> Discord + Email
    - matchers:
        - severity="warning"
      receiver: "warning-discord-email"
      repeat_interval: 2h

    # Route 3: Info Alerts -> Email Only
    - matchers:
        - severity="info"
      receiver: "email-only"
      repeat_interval: 12h

receivers:
  - name: "email-only"
    email_configs:
      - to: "devops-team@example.com"
        send_resolved: true

  - name: "warning-discord-email"
    email_configs:
      - to: "devops-team@example.com"
        send_resolved: true
    # Discord supports Slack-compatible incoming webhooks by appending /slack
    slack_configs:
      - api_url: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN/slack"
        channel: "#alerts-warning"
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}'
        text: '{{ .CommonAnnotations.description }}'

  - name: "critical-sms-discord"
    slack_configs:
      - api_url: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN/slack"
        channel: "#alerts-critical"
        send_resolved: true
        title: '🚨 [CRITICAL] {{ .CommonAnnotations.summary }}'
        text: '{{ .CommonAnnotations.description }}'
    webhook_configs:
      # Direct webhook pointing to your SMS Gateway (e.g., Twilio / SMS provider relay)
      - url: "https://api.example-sms-gateway.com/v1/send-sms"
        send_resolved: false

inhibit_rules:
  - source_matchers: ["severity=critical"]
    target_matchers: ["severity=warning"]
    equal: ["service"]