version: "3.8"

# Local observability stack: Grafana, Prometheus, Loki, Tempo, Alertmanager, Alloy.
# extra_hosts lets containers reach services running directly on your host machine
# (e.g. `php artisan serve`, `npm run dev`, `mvn spring-boot:run`) via host.docker.internal.
# This works on Docker Desktop (Mac/Windows) and on Linux with Docker 20.10+.

x-host-gateway: &host-gateway
  extra_hosts:
    - "host.docker.internal:host-gateway"

networks:
  observability:
    name: observability

volumes:
  grafana-data:
  prometheus-data:
  loki-data:
  tempo-data:

services:
  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks: [observability]
    depends_on: [prometheus, loki, tempo]

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-remote-write-receiver"   # required: Alloy pushes OTel-derived metrics here
      - "--web.enable-lifecycle"                # allows POST /-/reload to pick up rule changes
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    networks: [observability]
    <<: *host-gateway

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks: [observability]

  loki:
    image: grafana/loki:3.2.1
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    networks: [observability]

  tempo:
    image: grafana/tempo:2.6.1
    container_name: tempo
    restart: unless-stopped
    command: -config.file=/etc/tempo/tempo.yaml
    ports:
      - "3200:3200"   # Tempo query API (used by Grafana)
      - "4317:4317"   # OTLP gRPC (exposed here too as a fallback ingest path)
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks: [observability]

  alloy:
    image: grafana/alloy:v1.5.1
    container_name: alloy
    restart: unless-stopped
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "/etc/alloy/config.alloy"
    ports:
      - "12345:12345"  # Alloy UI: http://localhost:12345 - inspect component health here first
      - "4319:4317"    # OTLP gRPC - point your apps' OTEL_EXPORTER_OTLP_ENDPOINT here
      - "4320:4318"    # OTLP HTTP
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro   # lets Alloy discover & tail container logs
    networks: [observability]
    depends_on: [prometheus, loki, tempo]
    <<: *host-gateway
