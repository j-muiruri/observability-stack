version: "3.8"

# Self-hosted observability stack: Grafana, Prometheus, Loki, Tempo, Alertmanager, Alloy.
# extra_hosts lets containers reach services running directly on your host machine
# (e.g. `php artisan serve`, `npm run dev`, `mvn spring-boot:run`) via host.docker.internal.
# This works on Docker Desktop (Mac/Windows) and on Linux with Docker 20.10+.

x-host-gateway: &host-gateway
  extra_hosts:
    - "host.docker.internal:host-gateway"

networks:
  observability:
    name: observability

volumes:
  grafana-data:
  prometheus-data:
  loki-data:
  tempo-data:

services:
  grafana:
    image: grafana/grafana:13.2.3
    container_name: grafana
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${GRAFANA_CPU_LIMIT:-0.25}"
          memory: "${GRAFANA_MEMORY_LIMIT:-384M}"
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?Set GF_SECURITY_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
      # - GF_SERVER_ROOT_URL=https://monitor.company.com/grafana
      # - GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      - GF_SMTP_ENABLED=${GF_SMTP_ENABLED:-true}
      - GF_SMTP_HOST=${GF_SMTP_HOST:?Set GF_SMTP_HOST in .env}
      - GF_SMTP_USER=${GF_SMTP_USER:?Set GF_SMTP_USER in .env}
      - GF_SMTP_PASSWORD=${GF_SMTP_PASSWORD:?Set GF_SMTP_PASSWORD in .env}
      - GF_SMTP_FROM_ADDRESS=${GF_SMTP_FROM_ADDRESS:?Set GF_SMTP_FROM_ADDRESS in .env}
      - GF_SMTP_FROM_NAME=${GF_SMTP_FROM_NAME:-Observability}


    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks: [observability]
    depends_on: [prometheus, loki, tempo]
    user: "${GRAFANA_RUN_UID:-1000}:${GRAFANA_RUN_GID:-1000}"   # Grafana defaults to UID 472; tune this for host volume ownership.

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${PROMETHEUS_CPU_LIMIT:-0.50}"
          memory: "${PROMETHEUS_MEMORY_LIMIT:-1024M}"
        reservations:
          cpus: "${PROMETHEUS_CPU_RESERVATION:-0.10}"
          memory: "${PROMETHEUS_MEMORY_RESERVATION:-256M}"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-remote-write-receiver"   # required: Alloy pushes OTel-derived metrics here
      - "--web.enable-lifecycle"                # allows POST /-/reload to pick up rule changes
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
    - ./.secrets/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    - ./prometheus/targets:/etc/prometheus/targets:ro
    - prometheus-data:/prometheus
    networks: [observability]
    <<: *host-gateway

  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./.secrets/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks: [observability]
    <<: *host-gateway

  loki:
    image: grafana/loki:3.7.8
    container_name: loki
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${LOKI_CPU_LIMIT:-0.30}"
          memory: "${LOKI_MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "${LOKI_CPU_RESERVATION:-0.10}"
          memory: "${LOKI_MEMORY_RESERVATION:-128M}"
    ports:
      - "${LOKI_PORT:-3100}:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    networks: [observability]

  tempo:
    image: grafana/tempo:3.1.0
    container_name: tempo
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${TEMPO_CPU_LIMIT:-0.30}"
          memory: "${TEMPO_MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "${TEMPO_CPU_RESERVATION:-0.10}"
          memory: "${TEMPO_MEMORY_RESERVATION:-128M}"
    command: -config.file=/etc/tempo/tempo.yaml
    ports:
      - "${TEMPO_PORT:-3200}:3200"             # Tempo query API (used by Grafana)
      - "${TEMPO_OTLP_GRPC_PORT:-4317}:4317"   # OTLP gRPC (exposed here too as a fallback ingest path)
      - "${TEMPO_OTLP_HTTP_PORT:-4318}:4318"   # OTLP HTTP
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks: [observability]

  alloy:
    image: grafana/alloy:v1.20.1
    container_name: alloy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${ALLOY_CPU_LIMIT:-0.30}"
          memory: "${ALLOY_MEMORY_LIMIT:-512M}"
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "/etc/alloy/config.alloy"
    ports:
      - "${ALLOY_PORT:-12345}:12345"           # Alloy UI: http://localhost:12345 - inspect component health here first
      - "${ALLOY_OTLP_GRPC_PORT:-4319}:4317"   # OTLP gRPC - point your apps' OTEL_EXPORTER_OTLP_ENDPOINT here
      - "${ALLOY_OTLP_HTTP_PORT:-4320}:4318"   # OTLP HTTP
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro   # lets Alloy discover & tail container logs
    networks: [observability]
    depends_on: [prometheus, loki, tempo]
    <<: *host-gateway
