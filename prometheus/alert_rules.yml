groups:
  # 1. NEW RECORDING GROUP: Pre-calculates the heavy math once a minute
  - name: golden-signals-recording
    interval: 1m
    rules:
      - record: service:http_request_duration_seconds:p95
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service))

      - record: service:http_requests_5xx:ratio_rate5m
        expr: sum(rate(http_requests_total{status=~"5[0-9][0-9]"}[5m])) by (service) / sum(rate(http_requests_total[5m])) by (service)

  # 2. INFRASTRUCTURE ALERTS: Cheap and fast
  - name: golden-signals-infrastructure
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up{job=~"php-laravel-app|node-app|java-app|spring-boot"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "Prometheus has failed to scrape {{ $labels.job }} for 1 minute."

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space low on {{ $labels.instance }}"
          description: "Less than 15% free space remaining on {{ $labels.mountpoint }}."

  # 3. METRICS ALERTS: Now incredibly lightweight because they use pre-computed values!
  - name: golden-signals-metrics-alerts
    interval: 1m
    rules:
      - alert: HighErrorRate
        expr: service:http_requests_5xx:ratio_rate5m > 0.02
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate on {{ $labels.service }}"
          description: "{{ $labels.service }} has a 5xx error rate above 2% for 5 minutes."

      - alert: HighLatencyP95
        expr: service:http_request_duration_seconds:p95 > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency on {{ $labels.service }}"
          description: "{{ $labels.service }} p95 request duration has been above 1s for 5 minutes."
