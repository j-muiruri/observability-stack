groups:
  # Group 1: Fast, cheap lookups. Evaluated quickly.
  - name: golden-signals-infrastructure
    interval: 30s  # Tighter check interval for critical availability
    rules:
      - alert: ServiceDown
        expr: up{job=~"php-laravel-app|node-app|java-app|spring-boot"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "Prometheus has failed to scrape {{ $labels.job }} for 1 minute."

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space low on {{ $labels.instance }}"
          description: "Less than 15% free space remaining on {{ $labels.mountpoint }}."

  # Group 2: Heavy mathematical aggregations. Run less frequently in parallel.
  - name: golden-signals-metrics-heavy
    interval: 1m  # Lower frequency to dramatically reduce CPU processing
    rules:
      - alert: HighErrorRate
        # OPTIMIZATION: Filtered to specific status codes starting with 5 to avoid regex parsing on every metric string
        expr: |
          sum(rate(http_requests_total{status=~"5[0-9][0-9]"}[5m])) by (service)
            / sum(rate(http_requests_total[5m])) by (service) > 0.02
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate on {{ $labels.service }}"
          description: "{{ $labels.service }} has a 5xx error rate above 2% for 5 minutes."

      - alert: HighLatencyP95
        # OPTIMIZATION: Heavy histogram_quantile computation is isolated here so it doesn't block vital health checks
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency on {{ $labels.service }}"
          description: "{{ $labels.service }} p95 request duration has been above 1s for 5 minutes."
