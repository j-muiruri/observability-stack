# Copy to <cluster-node-name>.yml. Requires the native rabbitmq_prometheus
# plugin enabled: rabbitmq-plugins enable rabbitmq_prometheus
- targets:
    - "RABBITMQ_HOST:15692"
  labels:
    job: "rabbitmq"
    service: "SERVICE_NAME"
    team: "TEAM_NAME"
    env: "prod"
    tier: "1"
    stack: "rabbitmq"
